name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const semver = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/;
            if (!semver.test(tag)) {
              core.setFailed(`Release tag ${tag} is not valid SemVer prefixed with v.`);
              return;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `IdeaNote ${tag}`,
              body: [
                '## Installation',
                '',
                '| Platform | File |',
                '|----------|------|',
                '| macOS (Apple Silicon) | `.dmg` (aarch64) |',
                '| macOS (Intel) | `.dmg` (x64) |',
                '| Windows | `.msi` |',
                '',
                '### macOS',
                '',
                'This app is not notarized with Apple. On first launch macOS will block it. To open:',
                '',
                '1. **Right-click** the app → **Open** → click **Open** in the dialog',
                '2. Or go to **System Settings → Privacy & Security** → scroll down and click **Open Anyway**',
                '3. Or run in Terminal: `xattr -cr /Applications/IdeaSlide.app`',
                '',
                'This is only needed once. After that the app opens normally.',
                '',
                '### Windows',
                '',
                'Windows SmartScreen may show a warning. Click **More info** → **Run anyway**.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            macos_deployment_target: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            macos_deployment_target: "12.0"
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            macos_deployment_target: "12.0"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import json, sys
          from pathlib import Path

          version = sys.argv[1]

          tauri_conf = Path("src-tauri/tauri.conf.json")
          data = json.loads(tauri_conf.read_text())
          data["version"] = version
          tauri_conf.write_text(json.dumps(data, indent=2) + "\n")

          cargo_toml = Path("src-tauri/Cargo.toml")
          lines = cargo_toml.read_text().splitlines(True)
          for i, line in enumerate(lines):
              if line.startswith("version = "):
                  lines[i] = f'version = "{version}"\n'
                  break
          cargo_toml.write_text("".join(lines))

          pkg = Path("package.json")
          pkg_data = json.loads(pkg.read_text())
          pkg_data["version"] = version
          pkg.write_text(json.dumps(pkg_data, indent=2) + "\n")

          print(f"Synced version to {version}")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check Apple signing configuration
        if: runner.os == 'macOS'
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "has_certs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_certs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable ad-hoc signing for unsigned macOS builds
        if: runner.os == 'macOS' && steps.signing.outputs.has_certs == 'false'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("src-tauri/tauri.conf.json")
          data = json.loads(path.read_text())
          data.setdefault("bundle", {}).setdefault("macOS", {})["signingIdentity"] = "-"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Build Tauri app (signed)
        if: runner.os != 'macOS' || steps.signing.outputs.has_certs == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: IdeaNote ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (unsigned)
        if: runner.os == 'macOS' && steps.signing.outputs.has_certs == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: IdeaNote ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.slice(1);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const latestAsset = assets.find((asset) => asset.name === 'latest.json');
            if (!latestAsset) {
              core.setFailed('Updater manifest latest.json is missing.');
              return;
            }
            const updaterSignatures = assets.filter((asset) => asset.name.endsWith('.sig'));
            if (updaterSignatures.length < 3) {
              core.setFailed(`Expected signed updater assets for three targets, found ${updaterSignatures.length}.`);
              return;
            }
            const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: latestAsset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const manifestText = Buffer.isBuffer(response.data)
              ? response.data.toString('utf8')
              : Buffer.from(response.data).toString('utf8');
            let manifest;
            try {
              manifest = JSON.parse(manifestText);
            } catch (error) {
              core.setFailed(`Updater manifest is invalid JSON: ${error.message}`);
              return;
            }
            if (String(manifest.version).replace(/^v/, '') !== version) {
              core.setFailed(`Updater manifest version ${manifest.version} does not match tag ${tag}.`);
              return;
            }
            const requiredPlatforms = ['windows-x86_64', 'darwin-aarch64', 'darwin-x86_64'];
            for (const platform of requiredPlatforms) {
              const entry = manifest.platforms?.[platform];
              if (typeof entry?.url !== 'string' || typeof entry?.signature !== 'string' || !entry.signature.trim()) {
                core.setFailed(`Updater manifest is missing a complete ${platform} entry.`);
                return;
              }
              const updaterUrl = new URL(entry.url);
              const expectedPathPrefix = `/sivenDev/IdeaSlide/releases/download/${tag}/`;
              const decodedPath = decodeURIComponent(updaterUrl.pathname);
              if (updaterUrl.origin !== 'https://github.com' || !decodedPath.startsWith(expectedPathPrefix)) {
                core.setFailed(`Updater URL for ${platform} is not an IdeaSlide GitHub Release asset.`);
                return;
              }
              const updaterAssetName = decodedPath.slice(expectedPathPrefix.length);
              const assetNames = new Set(assets.map((asset) => asset.name));
              if (!updaterAssetName || !assetNames.has(updaterAssetName) || !assetNames.has(`${updaterAssetName}.sig`)) {
                core.setFailed(`Updater assets for ${platform} are missing their bundle or signature.`);
                return;
              }
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: `IdeaNote ${tag}`,
              draft: false,
              prerelease: false,
            });
