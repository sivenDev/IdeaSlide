<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Kition observed layout</title>
  <desc id="desc">A left Workspace tree, central tabbed data editor, and independent right AI chat.</desc>
  <defs><style>
    .bg{fill:#111217}.panel{fill:#18191f;stroke:#343640;stroke-width:2}.center{fill:#1d1e24;stroke:#343640;stroke-width:2}.bar{fill:#252630}.selected{fill:#292936}.violet{fill:#6555e8}.grid{stroke:#3a3c47;stroke-width:1}.label{fill:#f5f5f7;font:600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.muted{fill:#a8abb5;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.small{fill:#c7cad2;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.line{stroke:#777b87;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#777b87"/></marker></defs>
  <rect class="bg" width="1200" height="720" rx="24"/>
  <rect class="panel" x="24" y="24" width="238" height="672" rx="16"/>
  <rect class="center" x="278" y="24" width="574" height="672" rx="16"/>
  <rect class="panel" x="868" y="24" width="308" height="672" rx="16"/>
  <text class="label" x="46" y="62">Workspace</text><text class="small" x="46" y="91">FILES · BROWSER</text>
  <text class="muted" x="48" y="128">▾ Operations &amp; Analytics</text>
  <rect class="selected" x="40" y="144" width="206" height="42" rx="9"/><text class="muted" x="60" y="171">▦ Business Analytics</text>
  <text class="muted" x="60" y="210">▦ Email Inbox Sync</text><text class="muted" x="60" y="244">▦ Restaurant Operations</text>
  <text class="muted" x="48" y="292">▾ Projects &amp; Planning</text><text class="muted" x="60" y="328">▦ Product Launch</text><text class="muted" x="60" y="362">▦ Task Tracker</text>
  <rect class="bar" x="300" y="46" width="530" height="48" rx="9"/><text class="small" x="320" y="76">Welcome  ×   Batch Product Designer  ×   Business Analytics  ×</text>
  <text class="label" x="306" y="132">Business Metrics</text><rect class="violet" x="490" y="105" width="94" height="40" rx="9"/><text fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" x="512" y="131">Grid</text>
  <rect class="bar" x="300" y="160" width="530" height="50" rx="8"/><text class="small" x="316" y="191">+ Add record   Customize field   Filter   Sort   Group by</text>
  <rect fill="#24252c" x="300" y="222" width="530" height="42"/><path class="grid" d="M350 222v330M510 222v330M655 222v330M760 222v330M300 264h530M300 308h530M300 352h530M300 396h530M300 440h530M300 484h530M300 528h530"/>
  <text class="small" x="316" y="249">#</text><text class="small" x="370" y="249">Period</text><text class="small" x="530" y="249">Revenue</text><text class="small" x="675" y="249">Cost</text>
  <text class="muted" x="370" y="292">2026 Q1</text><text class="muted" x="530" y="292">480000</text><text class="muted" x="675" y="292">292000</text>
  <text class="muted" x="370" y="336">2026 Q2</text><text class="muted" x="530" y="336">552000</text><text class="muted" x="675" y="336">318000</text>
  <rect class="bar" x="300" y="628" width="530" height="42" rx="8"/><text class="small" x="316" y="654">3 records · Revenue sum 1,653,000 · Gross margin avg 41.53</text>
  <text class="label" x="894" y="62">AI chat</text><text class="small" x="894" y="91">NEW CHAT · HISTORY · COLLAPSE</text>
  <circle cx="1022" cy="286" r="28" fill="#5b3ca2"/><text fill="#fff" font-size="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" x="1015" y="294">K</text>
  <text class="muted" x="942" y="338">Ask about this table</text><text class="small" x="920" y="368">summarize · add columns · query</text>
  <rect class="bar" x="892" y="550" width="260" height="118" rx="16"/><text class="muted" x="912" y="584">Plan, write, or ask anything…</text><text class="small" x="912" y="642">model · configure · send</text>
  <path class="line" d="M250 400 C270 400 272 400 294 400"/><path class="line" d="M840 400 C856 400 858 400 880 400"/>
  <text class="small" x="24" y="714">Observed hierarchy: the data editor is central; Workspace and AI remain independent and simultaneously visible.</text>
</svg>
